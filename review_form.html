<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave a Review - Earn Points!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .star-rating {
            display: flex;
            gap: 4px;
        }
        .star {
            cursor: pointer;
            font-size: 24px;
            color: #d1d5db;
            transition: color 0.2s;
        }
        .star:hover,
        .star.active {
            color: #fbbf24;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen py-8">
    <div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-6">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-900 mb-2">Leave a Review</h1>
            <p class="text-gray-600">Share your experience and earn loyalty points!</p>
            <div class="bg-blue-50 border border-blue-200 rounded-lg p-3 mt-4">
                <p class="text-blue-800 text-sm font-medium">🎉 Earn 50-100 points for your review!</p>
            </div>
        </div>

        <form id="reviewForm" class="space-y-4">
            <!-- Customer Information -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
                    Email Address *
                </label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="your@email.com"
                />
            </div>

            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 mb-1">
                    Your Name
                </label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Your full name"
                />
            </div>

            <!-- Rating -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Rating *
                </label>
                <div class="star-rating" id="starRating">
                    <span class="star" data-rating="1">★</span>
                    <span class="star" data-rating="2">★</span>
                    <span class="star" data-rating="3">★</span>
                    <span class="star" data-rating="4">★</span>
                    <span class="star" data-rating="5">★</span>
                </div>
                <input type="hidden" id="rating" name="rating" required />
            </div>

            <!-- Product (Optional) -->
            <div>
                <label for="product" class="block text-sm font-medium text-gray-700 mb-1">
                    Product/Service (Optional)
                </label>
                <input
                    type="text"
                    id="product"
                    name="product"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="What did you purchase?"
                />
            </div>

            <!-- Review Comment -->
            <div>
                <label for="comment" class="block text-sm font-medium text-gray-700 mb-1">
                    Your Review *
                </label>
                <textarea
                    id="comment"
                    name="comment"
                    rows="4"
                    required
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Tell us about your experience..."
                ></textarea>
            </div>

            <!-- Submit Button -->
            <button
                type="submit"
                id="submitBtn"
                class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium"
            >
                Submit Review & Earn Points
            </button>
        </form>

        <!-- Success Message -->
        <div id="successMessage" class="hidden mt-4 p-4 bg-green-50 border border-green-200 rounded-md">
            <div class="flex items-center">
                <div class="text-green-600 mr-2">✅</div>
                <div>
                    <h3 class="text-green-800 font-medium">Review submitted successfully!</h3>
                    <p class="text-green-700 text-sm mt-1">Thank you for your feedback. Points will be awarded to your account.</p>
                </div>
            </div>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="hidden mt-4 p-4 bg-red-50 border border-red-200 rounded-md">
            <div class="flex items-center">
                <div class="text-red-600 mr-2">❌</div>
                <div>
                    <h3 class="text-red-800 font-medium">Error submitting review</h3>
                    <p class="text-red-700 text-sm mt-1" id="errorText">Please try again later.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuration - Update these values for your store
        const STORE_ID = "demo-store"; // Replace with actual store ID
        const API_BASE_URL = "http://localhost:8000"; // Replace with your API URL

        // Star rating functionality
        const stars = document.querySelectorAll('.star');
        const ratingInput = document.getElementById('rating');
        let selectedRating = 0;

        stars.forEach(star => {
            star.addEventListener('click', () => {
                selectedRating = parseInt(star.dataset.rating);
                ratingInput.value = selectedRating;
                updateStars();
            });

            star.addEventListener('mouseover', () => {
                const hoverRating = parseInt(star.dataset.rating);
                highlightStars(hoverRating);
            });
        });

        document.getElementById('starRating').addEventListener('mouseleave', () => {
            updateStars();
        });

        function updateStars() {
            stars.forEach((star, index) => {
                if (index < selectedRating) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            });
        }

        function highlightStars(rating) {
            stars.forEach((star, index) => {
                if (index < rating) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            });
        }

        // Form submission
        document.getElementById('reviewForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const successMessage = document.getElementById('successMessage');
            const errorMessage = document.getElementById('errorMessage');
            
            // Hide previous messages
            successMessage.classList.add('hidden');
            errorMessage.classList.add('hidden');
            
            // Validate rating
            if (!selectedRating) {
                showError('Please select a rating');
                return;
            }
            
            // Disable submit button
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';
            
            try {
                const formData = new FormData(e.target);
                const reviewData = {
                    email: formData.get('email'),
                    name: formData.get('name'),
                    rating: selectedRating,
                    comment: formData.get('comment'),
                    product: formData.get('product') || ''
                };
                
                // Submit review via the loyalty system API
                const response = await fetch(`${API_BASE_URL}/api/public/track`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        store_id: STORE_ID,
                        event_type: 'REVIEW',
                        user_id: reviewData.email, // Use email as user identifier
                        data: reviewData
                    })
                });
                
                if (response.ok) {
                    const result = await response.json();
                    showSuccess();
                    document.getElementById('reviewForm').reset();
                    selectedRating = 0;
                    updateStars();
                } else {
                    throw new Error('Failed to submit review');
                }
                
            } catch (error) {
                console.error('Error submitting review:', error);
                showError('Failed to submit review. Please try again.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Review & Earn Points';
            }
        });
        
        function showSuccess() {
            document.getElementById('successMessage').classList.remove('hidden');
            // Scroll to success message
            document.getElementById('successMessage').scrollIntoView({ behavior: 'smooth' });
        }
        
        function showError(message) {
            document.getElementById('errorText').textContent = message;
            document.getElementById('errorMessage').classList.remove('hidden');
            // Scroll to error message
            document.getElementById('errorMessage').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
